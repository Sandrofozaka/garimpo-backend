name: Sync Produtos

on:
  schedule:
    # Roda a cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  # Permite rodar manualmente pelo painel do GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Instalar dependências
        run: npm install

      - name: Rodar sync de produtos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_SECRET: ${{ secrets.ML_SECRET }}
          NODE_ENV: production
        run: node src/sync.cjs
